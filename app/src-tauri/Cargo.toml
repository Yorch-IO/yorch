[package]
name = "company-brain"
version = "0.1.0"
description = "Build a searchable company brain from your own documents, locally."
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
# Required for mobile targets, which link the crate as a library rather than
# running main(). All three types must be present.
name = "company_brain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "sync", "time", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"

[profile.release]
codegen-units = 1
lto = true
strip = true

[dev-dependencies]
# Already in the lock file transitively via tauri; declared so the stack tests
# can write a throwaway `.env` instead of touching the user's real one.
tempfile = "3"
