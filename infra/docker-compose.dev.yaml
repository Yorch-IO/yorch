# Dev overlay: build the worker image from the local source tree instead of
# pulling a published one.
#
#     docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d --build
#
# The build context is the repo root because the image needs both `docaget/`
# (the docagent engine, installed as a path dependency) and `worker/`.
#
# A packaged app never uses this file — it pulls the pinned image named by
# BRAIN_WORKER_IMAGE, because an installed app has no source tree to build from.

services:
  api: &build
    build:
      context: ..
      dockerfile: worker/Dockerfile
    image: ${BRAIN_WORKER_IMAGE:-company-brain-worker:dev}

  worker: *build

# The NestJS control plane and the migrate step share one image, built from
# `../../yorch-tauri-backend` — its own checkout, beside this one rather than
# inside it. The context is therefore outside the repo, which is fine for a
# dev overlay and is exactly why the path is here and not in the base file:
# a packaged app pulls the pinned image and never builds.
#
# BRAIN_BACKEND_CONTEXT overrides it, because a sibling directory name is an
# assumption about someone else's disk.
#
# `migrate` is in the default profile, so a free-mode stack builds this image
# too even though it never runs the server role. That is the price of one schema
# owner, and it is the right price: the alternative is two migration runners
# against one catalog.
  migrate: &backend-build
    build:
      context: ${BRAIN_BACKEND_CONTEXT:-../../yorch-tauri-backend}
      dockerfile: Dockerfile
    image: ${BRAIN_BACKEND_IMAGE:-company-brain-backend:dev}

  backend:
    <<: *backend-build
