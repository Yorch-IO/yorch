[project]
name = "brainworker"
version = "0.1.0"
description = "Temporal workflows and control API wrapping the docagent indexing engine"
requires-python = ">=3.13"

dependencies = [
    "docagent",
    "temporalio>=1.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.28.1",
    "neo4j>=5.28",
    "google-genai>=1.0",
    # The video path. Both are pure-Python wheels, so `worker/Dockerfile` keeps
    # its "no compiler in the image" property — and `bestaudio` with no
    # postprocessor means no ffmpeg either, which is the difference between this
    # image and ~80 MB of apt on a 60 GiB volume that also holds the corpus.
    #
    # yt-dlp is pinned to a floor rather than an exact version because YouTube
    # changes underneath it and a stale one fails at extraction, not at build.
    "yt-dlp>=2026.1.1",
    "boto3>=1.35",
    # Recasting a document into another genre runs two `StateGraph`s, each
    # inside one activity. It arrives today only transitively through
    # `docagent`, which is a dependency this package could drop tomorrow — and
    # then a feature here would break for a reason nothing in this file
    # mentions. Pure Python, so the image keeps its "no compiler" property.
    "langgraph>=1.2.9",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

# Local path dependency for development. The Docker build installs ../docaget
# explicitly before this package, so the resolver finds docagent already
# present and this source is never consulted there.
[tool.uv.sources]
docagent = { path = "../docaget", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["brainworker"]
